<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>DREAMS · Interactive CRS</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --bg: #080b12; --panel: #10151f; --panel-2: #161d2a; --line: #283247;
      --text: #edf2ff; --muted: #93a0b8; --accent: #8be0c4; --accent-2: #70a7ff;
      --danger: #ff8f8f;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: radial-gradient(circle at 15% -10%, #182840 0, transparent 34%), var(--bg); color: var(--text); }
    button, textarea { font: inherit; }
    .shell { min-height: 100vh; display: grid; grid-template-rows: auto 1fr; }
    header { height: 70px; padding: 0 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--line); background: rgba(8,11,18,.82); backdrop-filter: blur(16px); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .mark { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #06111a; font-weight: 900; }
    h1 { margin: 0; font-size: 16px; letter-spacing: .08em; }
    .subtitle { margin-top: 3px; font-size: 12px; color: var(--muted); }
    .status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #f3be67; box-shadow: 0 0 12px currentColor; }
    .dot.ready { background: var(--accent); }
    main { min-height: 0; display: grid; grid-template-columns: minmax(420px, 1.35fr) minmax(360px, .9fr); gap: 1px; background: var(--line); }
    .chat, .inspector { min-height: 0; background: var(--bg); }
    .chat { display: grid; grid-template-rows: 1fr auto; }
    .messages { min-height: 0; overflow: auto; padding: 28px max(24px, 6vw); }
    .empty-chat { max-width: 580px; margin: 15vh auto 0; text-align: center; }
    .empty-chat h2 { margin: 0 0 12px; font-size: clamp(26px, 4vw, 42px); letter-spacing: -.04em; }
    .empty-chat p { color: var(--muted); line-height: 1.7; }
    .message { max-width: 720px; margin: 0 auto 22px; display: grid; grid-template-columns: 38px 1fr; gap: 13px; animation: rise .24s ease-out; }
    @keyframes rise { from { transform: translateY(5px); opacity: 0; } }
    .avatar { width: 34px; height: 34px; border: 1px solid var(--line); border-radius: 10px; display: grid; place-items: center; color: var(--muted); font-size: 12px; font-weight: 800; }
    .message.assistant .avatar { background: #142d2a; border-color: #28524a; color: var(--accent); }
    .speaker { font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 6px; }
    .bubble { line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
    .action { display: inline-block; margin-top: 9px; padding: 3px 8px; border: 1px solid #345a71; border-radius: 999px; color: #9dd9ff; font: 11px ui-monospace, monospace; }
    .composer-wrap { padding: 18px max(24px, 6vw) 22px; background: linear-gradient(transparent, var(--bg) 22%); }
    .composer { max-width: 720px; margin: auto; display: grid; grid-template-columns: 1fr auto; align-items: end; gap: 10px; padding: 10px; border: 1px solid var(--line); border-radius: 16px; background: var(--panel); box-shadow: 0 18px 50px rgba(0,0,0,.28); }
    textarea { width: 100%; max-height: 160px; min-height: 44px; resize: none; padding: 11px 12px; border: 0; outline: 0; background: transparent; color: var(--text); line-height: 1.45; }
    textarea::placeholder { color: #65728a; }
    button { border: 1px solid var(--line); border-radius: 10px; background: var(--panel-2); color: var(--text); cursor: pointer; }
    button:hover { border-color: #44536f; }
    button:disabled { opacity: .45; cursor: wait; }
    .send { width: 46px; height: 44px; border: 0; background: var(--accent); color: #07130f; font-size: 18px; font-weight: 900; }
    .new-chat { padding: 8px 11px; font-size: 12px; }
    .inspector { overflow: auto; padding: 22px; }
    .inspector-head { display: flex; align-items: start; justify-content: space-between; margin-bottom: 18px; }
    .inspector h2 { margin: 0; font-size: 15px; }
    .inspector .hint { margin-top: 5px; color: var(--muted); font-size: 12px; }
    .metric { color: var(--accent); font: 12px ui-monospace, monospace; }
    details { border-top: 1px solid var(--line); padding: 16px 0; }
    summary { cursor: pointer; font-weight: 700; font-size: 13px; }
    .state { margin: 12px 0 0; padding: 12px; border-radius: 10px; background: var(--panel); color: #b9c7de; white-space: pre-wrap; overflow-wrap: anywhere; font: 11px/1.55 ui-monospace, monospace; }
    .tree { margin-top: 14px; overflow: auto; }
    .tree ul { margin: 8px 0 0 14px; padding-left: 15px; border-left: 1px solid #354057; }
    .tree li { list-style: none; margin: 8px 0; }
    .tree-node { display: inline-grid; gap: 2px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel); font-size: 11px; }
    .tree-node strong { color: #9dd9ff; }
    .tree-node span { color: var(--muted); font-family: ui-monospace, monospace; }
    .timeline { margin-top: 12px; display: grid; gap: 8px; }
    .event { display: grid; grid-template-columns: 55px 1fr; gap: 8px; padding: 9px; border-radius: 8px; background: var(--panel); }
    .event time { color: #68758d; font: 10px ui-monospace, monospace; }
    .event strong { display: block; font-size: 11px; color: #cbd6e9; }
    .event code { display: block; margin-top: 3px; color: var(--muted); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 10px; }
    .placeholder { margin-top: 12px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .error { color: var(--danger); }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; grid-template-rows: minmax(68vh, 1fr) auto; }
      .inspector { max-height: 55vh; }
      header { padding: 0 14px; } .subtitle { display: none; }
      .messages, .composer-wrap { padding-left: 16px; padding-right: 16px; }
    }
  </style>
</head>
<body>
<div class="shell">
  <header>
    <div class="brand"><div class="mark">D</div><div><h1>DREAMS</h1><div class="subtitle">Dual MCTS Conversational Recommender</div></div></div>
    <div style="display:flex;align-items:center;gap:14px"><div class="status"><span id="status-dot" class="dot"></span><span id="status">正在初始化</span></div><button id="new-chat" class="new-chat" type="button">新对话</button></div>
  </header>
  <main>
    <section class="chat" aria-label="CRS 对话">
      <div id="messages" class="messages" aria-live="polite">
        <div id="empty" class="empty-chat"><h2>想看什么电影？</h2><p>描述你喜欢的类型、演员、导演或最近看过的电影。DREAMS 会先了解偏好，再通过双层 MCTS 搜索给出推荐。</p></div>
      </div>
      <div class="composer-wrap">
        <form id="composer" class="composer">
          <textarea id="input" rows="1" maxlength="4000" aria-label="输入消息" placeholder="例如：我想看一部节奏轻松的科幻片……" disabled></textarea>
          <button id="send" class="send" type="submit" aria-label="发送" disabled>↑</button>
        </form>
      </div>
    </section>
    <aside class="inspector" aria-label="MCTS 运行追踪">
      <div class="inspector-head"><div><h2>运行追踪</h2><div class="hint">树、reward 与 feedback 实时更新</div></div><span id="event-count" class="metric">0 events</span></div>
      <details open><summary>Conversation state</summary><pre id="state" class="state">等待第一条消息…</pre></details>
      <details open><summary>Action search tree</summary><div id="tree" class="tree"><p class="placeholder">前两轮默认直接询问偏好，不进行 simulation/backpropagation。</p></div></details>
      <details open><summary>Reward &amp; feedback</summary><div id="timeline" class="timeline"><p class="placeholder">尚无事件。</p></div></details>
    </aside>
  </main>
</div>
<script>
  const ui = {
    messages: document.querySelector('#messages'), empty: document.querySelector('#empty'),
    form: document.querySelector('#composer'), input: document.querySelector('#input'),
    send: document.querySelector('#send'), status: document.querySelector('#status'),
    dot: document.querySelector('#status-dot'), state: document.querySelector('#state'),
    tree: document.querySelector('#tree'), timeline: document.querySelector('#timeline'),
    count: document.querySelector('#event-count'), newChat: document.querySelector('#new-chat')
  };
  let sessionId = null;
  let busy = false;

  async function api(path, body = {}) {
    const response = await fetch(path, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body) });
    const data = await response.json();
    if (!response.ok) throw new Error(data.error || `HTTP ${response.status}`);
    return data;
  }

  function setStatus(text, ready = false) {
    ui.status.textContent = text;
    ui.dot.classList.toggle('ready', ready);
  }

  function setBusy(value) {
    busy = value;
    ui.input.disabled = value || !sessionId;
    ui.send.disabled = value || !sessionId;
  }

  function addMessage(role, text, action = '') {
    ui.empty?.remove();
    const row = document.createElement('article');
    row.className = `message ${role}`;
    const avatar = document.createElement('div');
    avatar.className = 'avatar'; avatar.textContent = role === 'user' ? 'YOU' : 'CRS';
    const body = document.createElement('div');
    const speaker = document.createElement('div');
    speaker.className = 'speaker'; speaker.textContent = role === 'user' ? 'You' : 'DREAMS';
    const bubble = document.createElement('div');
    bubble.className = 'bubble'; bubble.textContent = text;
    body.append(speaker, bubble);
    if (action) {
      const badge = document.createElement('span');
      badge.className = 'action'; badge.textContent = action; body.append(badge);
    }
    row.append(avatar, body); ui.messages.append(row);
    ui.messages.scrollTop = ui.messages.scrollHeight;
  }

  function treeNode(node) {
    const li = document.createElement('li');
    const card = document.createElement('div'); card.className = 'tree-node';
    const name = document.createElement('strong'); name.textContent = node.action;
    const stats = document.createElement('span'); stats.textContent = `N ${node.visits} · avg ${node.average} · value ${node.value}`;
    card.append(name, stats); li.append(card);
    if (node.children?.length) {
      const ul = document.createElement('ul'); node.children.forEach(child => ul.append(treeNode(child))); li.append(ul);
    }
    return li;
  }

  function renderTrace(trace) {
    const events = trace?.events || [];
    ui.count.textContent = `${events.length} events`;
    ui.state.textContent = JSON.stringify(trace?.state || {}, null, 2);
    ui.tree.replaceChildren();
    if (trace?.tree) { const ul = document.createElement('ul'); ul.append(treeNode(trace.tree)); ui.tree.append(ul); }
    else { const p = document.createElement('p'); p.className = 'placeholder'; p.textContent = '前两轮默认直接询问偏好，不进行 simulation/backpropagation。'; ui.tree.append(p); }
    ui.timeline.replaceChildren();
    if (!events.length) { const p = document.createElement('p'); p.className = 'placeholder'; p.textContent = '尚无事件。'; ui.timeline.append(p); return; }
    events.slice(-40).reverse().forEach(event => {
      const row = document.createElement('div'); row.className = 'event';
      const time = document.createElement('time'); time.textContent = event.time || '';
      const body = document.createElement('div');
      const title = document.createElement('strong'); title.textContent = `#${event.step} ${event.event}`;
      const details = {...event}; delete details.step; delete details.time; delete details.event;
      const code = document.createElement('code'); code.textContent = JSON.stringify(details, null, 2).slice(0, 900);
      body.append(title, code); row.append(time, body); ui.timeline.append(row);
    });
  }

  async function newSession(clear = true) {
    setBusy(true); setStatus('正在加载 CRS');
    try {
      const data = await api('/api/session'); sessionId = data.session_id;
      if (clear) {
        ui.messages.replaceChildren();
        const empty = document.createElement('div'); empty.id = 'empty'; empty.className = 'empty-chat';
        const title = document.createElement('h2'); title.textContent = '想看什么电影？';
        const text = document.createElement('p'); text.textContent = '描述你喜欢的类型、演员、导演或最近看过的电影。DREAMS 会先了解偏好，再通过双层 MCTS 搜索给出推荐。';
        empty.append(title, text); ui.messages.append(empty); ui.empty = empty;
      }
      renderTrace(data.trace); setStatus('已连接', true); setBusy(false); ui.input.focus();
    } catch (error) {
      sessionId = null; setBusy(false); setStatus('初始化失败'); addMessage('assistant', `无法启动会话：${error.message}`); document.querySelector('.message:last-child .bubble').classList.add('error');
    }
  }

  ui.form.addEventListener('submit', async event => {
    event.preventDefault();
    const message = ui.input.value.trim(); if (!message || busy || !sessionId) return;
    ui.input.value = ''; ui.input.style.height = 'auto'; addMessage('user', message); setBusy(true); setStatus('CRS 正在搜索');
    try {
      const data = await api('/api/chat', {session_id: sessionId, message});
      addMessage('assistant', data.reply, data.action); renderTrace(data.trace); setStatus('已连接', true);
    } catch (error) {
      addMessage('assistant', `本轮执行失败：${error.message}`); document.querySelector('.message:last-child .bubble').classList.add('error'); setStatus('请求失败');
    } finally { setBusy(false); ui.input.focus(); }
  });
  ui.input.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); ui.form.requestSubmit(); } });
  ui.input.addEventListener('input', () => { ui.input.style.height = 'auto'; ui.input.style.height = `${ui.input.scrollHeight}px`; });
  ui.newChat.addEventListener('click', () => { if (!busy) newSession(true); });
  newSession(false);
</script>
</body>
</html>
